name: Model topic analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install mandatory local model stack
        run: uv sync
      - name: Generate direct and model-based analysis
        run: uv run dsa-analysis analyze-text
      - name: Validate generated model artifacts
        run: uv run python -m unittest tests.test_model_topics tests.test_text_analysis -v
      - name: Install publication scanner
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Commit reproducible model artifacts
        run: |
          git config user.name "hanshanley"
          git config user.email "hwahhanley@gmail.com"
          git add \
            data/analysis \
            outputs/figures/text_analysis \
            outputs/tables/text_analysis \
            report/model_topic_analysis.md \
            report/text_analysis.md \
            uv.lock
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            "$RUNNER_TEMP/gitleaks" git --staged --pre-commit --redact=100 \
              --ignore-gitleaks-allow --max-decode-depth=3 --max-archive-depth=2 --no-banner
            uv run python -m dsa_analysis.publication_security
            git commit -m "Regenerate local model topic analysis"
            git push
          fi
