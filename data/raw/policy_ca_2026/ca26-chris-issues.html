xt-decoration-color: var(--color-text);\"\u003e-Blocking new voter suppression efforts such as the SAVE Act\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cspan style=\"color: var(--color-text); text-decoration-color: var(--color-text);\"\u003e-Ensuring every eligible American can register and cast a ballot without intimidation or unnecessary barriers\u003c/span\u003e\u003cbr\u003e\u003c/p\u003e"},"slug":"democracy","tags":[],"type":"ISSUES_LIST","visibility":"NONE"},"2d0c3651-300a-4031-a156-c1c55faea326":{"id":"2d0c3651-300a-4031-a156-c1c55faea326","data":{"title":"Outdoor Meet \u0026 Greet in Camarillo","headline":"\u003ch4\u003eOutdoor Meet \u0026 Greet in Camarillo\u003c/h4\u003e","location":{"location":"\u003cp\u003e\u003cstrong\u003eCamarillo, CA\u003c/strong\u003e\u003c/p\u003e"},"description":"\u003cp\u003eAddress to be provided upon RSVP\u003c/p\u003e","occurrences":[{"id":"2d0c3651-300a-4031-a156-c1c55faea326-1775941200","end":"2026-04-11T23:00:00.000Z","start":"2026-04-11T21:00:00.000Z"}],"shortDescription":"\u003cp\u003eAddress to be Provided Upon RSVP\u003c/p\u003e"},"slug":"outdoor-meet-greet-in-camarillo","tags":[],"type":"EVENTS_LIST","visibility":"DEFAULT"},"0a9ffa46-8772-44c9-b0d9-caecc1c3a85b":{"id":"0a9ffa46-8772-44c9-b0d9-caecc1c3a85b","data":{"title":"\u003ch2\u003eForeign Policy \u0026 Gaza\u003c/h2\u003e","eyebrow":"\u003ch6\u003eYour name believes in\u003c/h6\u003e","shortDescription":"\u003cp\u003eAmerican foreign policy should be guided by human rights, diplomacy, international law, the pursuit of peace, and the protection of civilian life.\u003c/p\u003e\u003cp\u003eWhat is happening in Gaza is a genocide. The mass killing of civilians, the destruction of homes, hospitals, schools, and essential infrastructure, and the deliberate deprivation of food, water, and medical care demand moral clarity and action from the United States.\u003c/p\u003e\u003cp\u003eI support an immediate and permanent ceasefire, the release of all hostages, unrestricted humanitarian aid, and a just and lasting peace that guarantees freedom, dignity, security, and self-determination for both Palestinians and Israelis.\u003c/p\u003e\u003cp\u003eI do not support providing weapons, munitions, military assistance, or logistical support to the Israeli government until it verifiably demonstrates compliance with international humanitarian law, respects the human rights of Palestinians, and adheres to U.S. laws, policies, and standards governing the protection of civilians and civilian infrastructure in military conflicts.\u003c/p\u003e\u003cp\u003eHuman rights are universal. They cannot be selectively applied based on politics, nationality, or geography. As a member of Congress, I will support a foreign policy that prioritizes peace, diplomacy, accountability, democratic self-determination and the protection of innocent lives wherever they are threatened.\u003c/p\u003e"},"slug":"foreign-policy-gaza","tags":[],"type":"ISSUES_LIST","visibility":"NONE"},"c55a43fc-979c-4848-969e-4c5ee0080935":{"id":"c55a43fc-979c-4848-969e-4c5ee0080935","data":{"date":"2022-09-01T04:00:00.000Z","link":null,"slug":"news-1","title":"\u003ch4\u003eHeadline goes here\u003c/h4\u003e","shortDescription":"\u003cp\u003e\u003cstrong\u003eIf you want to link an external news source,\u003c/strong\u003e use the “link” icons on the sidebar. Anything linked externally will automatically be listed as “news” and any article you create on the site itself will automatically be listed as a “press release.”\u003c/p\u003e","shortExtraDescription":"Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has b"},"slug":"news-1","tags":[],"type":"NEWS_LIST","visibility":"DEFAULT"},"9ed6bbdf-e70a-4b52-8884-31b7c5929d2d":{"id":"9ed6bbdf-e70a-4b52-8884-31b7c5929d2d","data":{"slug":"issue-2","title":"\u003ch2\u003eCLIMATE \u003cbr\u003e\u0026amp; \u003cbr\u003eENVIRONMENTAL JUSTICE\u003c/h2\u003e","eyebrow":"\u003ch6\u003eyour name believes in\u003c/h6\u003e","highlight":"I helped create hundreds…","shortDescription":"\u003cp\u003e\u003cstrong\u003eAGRICULTURAL ECONOMY \u0026amp; WATER SECURITY\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eClimate change poses a clear and present danger to our district—from devastating wildfires to prolonged droughts that threaten our agricultural economy and water security. \u003cbr\u003e\u003cbr\u003e-I will work to undo Trump-era climate rollbacks that weakened environmental protections and put communities at risk\u003c/p\u003e\u003cp\u003e-Accelerate a just transition to a clean energy, pollution-free economy built on high-paying union jobs\u003cbr\u003e\u003cbr\u003e-I support passing the Environmental Justice for All Act to protect neighborhoods disproportionately burdened by toxic exposure and environmental degradation\u003c/p\u003e\u003cp\u003e-Preserving our open space and coastal resources\u003c/p\u003e\u003cp\u003e-Aggressively accelerating cleanup at federally designated contamination sites such as Halaco, the Pacific Coast Pipeline corridor, and the Santa Susana Field Laboratory \u003cbr\u003e\u003cbr\u003eOur community deserves clean air, safe water, and a livable climate—now and for generations to come.\u003c/p\u003e","shortExtraDescription":"Write a short blurb about an issue your campaign is highlighting. Try to keep the text a similar size between the various issue blurbs."},"slug":"issue-2","tags":[],"type":"ISSUES_LIST","visibility":"NONE"},"48b636b3-ef0c-4a27-b0d1-d9c97ed32265":{"id":"48b636b3-ef0c-4a27-b0d1-d9c97ed32265","data":{"title":"Westlake Village","headline":"\u003ch4\u003eWestlake Village\u003c/h4\u003e","location":{"type":"physical","location":"\u003cp\u003e\u003cstrong\u003e1234 Maple Street\u003c/strong\u003e\u003cbr /\u003eMunicipal, State 12345\u003c/p\u003e"},"description":"Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.","occurrences":[{"id":"48b636b3-ef0c-4a27-b0d1-d9  ARE BASIC NECESSITIES \u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003eMy goal is simple: ensure that everyone can build stable, prosperous lives without being crushed by systemic economic pressures.\u003cbr\u003e\u003cbr\u003e-I will pursue federal policies that lower housing costs through supply, affordability, and tenant protections\u003cbr\u003e\u003cbr\u003e-Confront the ripple effects of tariffs and corporate price-gouging on everyday goods\u003c/p\u003e\u003cp\u003e-Focus on universal childcare and early childhood education\u003cbr\u003e\u003cbr\u003e -Advocate for tuition-free public college and trade school\u003cbr\u003e\u003cbr\u003e-Deliver meaningful federal student loan forgiveness \u003cbr\u003e\u003c/p\u003e"},"slug":"cost-of-living","tags":[],"type":"ISSUES_LIST","visibility":"NONE"},"4e7dd930-11f8-4983-8a96-bb41259a60c2":{"id":"4e7dd930-11f8-4983-8a96-bb41259a60c2","data":{"url":"","date":"January 1, 1900","slug":"event-1","fields":[{"name":"firstName","type":"input","label":"First Name","isUnique":true,"isRequired":true},{"name":"lastName","type":"input","label":"Last Name","isUnique":true,"isRequired":true},{"name":"phoneNumber","type":"input","label":"Phone Number","isUnique":true,"isRequired":true},{"name":"zipOrPostalCode","type":"input","label":"ZIP Code","isUnique":true,"isRequired":true},{"name":"email","type":"input","label":"Email","isUnique":true,"inputType":"email","isRequired":true}],"headline":"\u003ch4\u003eMeet \u0026amp; Greet with Congressional Candidate\u003cbr\u003eChris Espinosa\u003c/h4\u003e","location":{"location":"\u003cp\u003e\u003cstrong\u003eSanta Paula - Address to be provided upon RSVP\u003c/strong\u003e\u003c/p\u003e"},"wrapForm":true,"blockStyle":"WHITE","description":"Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.","occurrences":[{"id":"4e7dd930-11f8-4983-8a96-bb41259a60c2-1773003600","end":"2026-03-08T23:00:00.000Z","start":"2026-03-08T21:00:00.000Z"}],"shortDescription":"Write a short blurb about the event."},"slug":"event-1","tags":[],"type":"EVENTS_LIST","visibility":"DEFAULT"},"8f8f4663-3726-4bcf-942c-f2eeb2b24e87":{"id":"8f8f4663-3726-4bcf-942c-f2eeb2b24e87","data":{"slug":"issue-1","title":"\u003ch2\u003eHEALTHCARE FOR ALL\u003c/h2\u003e","eyebrow":"\u003ch6\u003eyour name believes in\u003c/h6\u003e","highlight":"I helped create hundreds…","shortDescription":"\u003cp\u003e\u003cstrong\u003eHEALTHCARE IS A HUMAN RIGHT.\u003c/strong\u003e\u003cbr\u003e\u003cbr\u003eI support universal coverage through a Medicare for All–style system that guarantees comprehensive care—medical, dental, vision, reproductive, and mental health—without financial barriers. \u003cbr\u003e\u003cbr\u003e-I will defend women, the LGBTQ+ community, immigrants, and other vulnerable communities from politically motivated attacks on their access to care\u003cbr\u003e\u003cbr\u003e-Ensure federal healthcare decisions are grounded in science and the expertise of medical professionals\u003cbr\u003e\u003cbr\u003e-I will work to strengthen local healthcare infrastructure so families in our district can access high-quality care close to home with a well-trained and unionized healthcare workforce\u003c/p\u003e","shortExtraDescription":"Write a short blurb about an issue your campaign is highlighting. Try to keep the text a similar size between the various issue blurbs."},"slug":"issue-1","tags":[],"type":"ISSUES_LIST","visibility":"NONE"},"a8e7594d-501e-41e8-af3e-4ee1062e84e7":{"id":"a8e7594d-501e-41e8-af3e-4ee1062e84e7","data":{"title":"\u003ch2\u003eWomens Equity \u0026 Freedom\u003c/h2\u003e","eyebrow":"\u003ch6\u003eYour name believes in\u003c/h6\u003e","shortDescription":"\u003cp\u003eWomen deserve more than symbolic support. They deserve freedom, safety, dignity, economic security, and full equality under the law.\u003c/p\u003e\u003cp\u003eFor too long, politicians have treated women’s rights as negotiable while extremists and corporate interests have worked to strip away reproductive freedom, undermine healthcare access, weaken workplace protections, and allowed pay equity and other disparities to perpetuate. I will not compromise on defending the rights and bodily autonomy of women and girls.\u003c/p\u003e\u003cp\u003eI support codifying Roe v. Wade into federal law and restoring nationwide protections for abortion access. Healthcare decisions belong to patients, families, and medical professionals — not politicians or judges. I will fight to protect access to contraception, IVF, gender-affirming care, maternal healthcare, and comprehensive reproductive healthcare in every community.\u003c/p\u003e\u003cp\u003eWomen should not be forced to choose between raising a family and surviving economically. I support universal paid family and medical leave, universal childcare, equal pay protections, stronger labor rights, and expanding access to affordable housing and healthcare. Economic justice is women’s justice.\u003c/p\u003e\u003cp\u003eI will also fight to confront gender-based violence, discrimination, and harassment wherever they occur — in workplaces, schools, online spaces, healthcare systems, or within our political institutions. Women and girls deserve protection from these injustices ever occurring in the first place, and survivors deserve protection, accountability, and support.\u003c/p\u003e\u003cp\u003eAs attacks on women’s rights intensify nationwide, we need leaders willing to meet this moment with courage and clarity, and men must play an active role in standing up for women's rights. I am proud to stand with the movements defending reproductive freedom, gender equality, labor rights, LGBTQ+ rights, and human dignity for all people.\u003c/p\u003e"},"slug":"womens-equity-freedom","tags":[],"type":"ISSUES_LIST","visibility":"NONE"},"a1ce6b26-3c79-487a-ae3b-cd0a1b57608f":{"id":"a1ce6b26-3c79-487a-ae3b-cd0a1b57608f","data":{"date":"2022-09-01T04:00:00.000Z","link":null,
