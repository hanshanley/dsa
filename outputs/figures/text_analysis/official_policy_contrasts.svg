ans-serif" font-size="12px" font-weight="400" font-style="normal">Border Protection personnel abide by our values and</text><text x="802" y="345" text-anchor="start" fill="#3D6F8C" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" font-style="normal">professional, evidence-based standards and are held</text><text x="802" y="365" text-anchor="start" fill="#3D6F8C" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" font-style="normal">accountable for any inappropriate, unlawful, or…</text><text x="660" y="320" text-anchor="middle" fill="#1A1A1A" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14px" font-weight="700" font-style="normal">Immigration</text><text x="660" y="343" text-anchor="middle" fill="#6B6B6B" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11px" font-weight="400" font-style="normal">2020</text><text x="660" y="365" text-anchor="middle" fill="#6B6B6B" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10px" font-weight="700" font-style="normal">Explicit Disagreement</text><rect x="48.00" y="422.00" width="490.00" height="112.00" fill="#F8EBE8" rx="3"/><rect x="782.00" y="422.00" width="490.00" height="112.00" fill="#E8EEF1" rx="3"/><line x1="660" y1="426" x2="660" y2="530" stroke="#D6D3CC" stroke-width="1"/><text x="68" y="450" text-anchor="start" fill="#C85A3D" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" font-style="normal">defunding the police/refunding communities</text><text x="802" y="450" text-anchor="start" fill="#3D6F8C" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" font-style="normal">We need to fund the police, not defund the police.</text><text x="660" y="465" text-anchor="middle" fill="#1A1A1A" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14px" font-weight="700" font-style="normal">Public Safety</text><text x="660" y="488" text-anchor="middle" fill="#6B6B6B" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11px" font-weight="400" font-style="normal">2024</text><text x="660" y="510" text-anchor="middle" fill="#6B6B6B" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10px" font-weight="700" font-style="normal">Explicit Disagreement</text><rect x="48.00" y="567.00" width="490.00" height="112.00" fill="#F8EBE8" rx="3"/><rect x="782.00" y="567.00" width="490.00" height="112.00" fill="#E8EEF1" rx="3"/><line x1="660" y1="571" x2="660" y2="675" stroke="#D6D3CC" stroke-width="1"/><text x="68" y="595" text-anchor="start" fill="#C85A3D" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" font-style="normal">We want to collectively own the key economic drivers</text><text x="68" y="615" text-anchor="start" fill="#C85A3D" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" font-style="normal">that dominate our lives, such as energy production and</text><text x="68" y="635" text-anchor="start" fill="#C85A3D" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" font-style="normal">transportation.</text><text x="802" y="595" text-anchor="start" fill="#3D6F8C" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" font-style="normal">capitalism without competition isn&#x27;t capitalism, it&#x27;s</text><text x="802" y="615" text-anchor="start" fill="#3D6F8C" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12px" font-weight="400" font-style="normal">exploitation.</text><text x="660" y="610" text-anchor="middle" fill="#1A1A1A" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14px" font-weight="700" font-style="normal">Economic Ownership</text><text x="660" y="633" text-anchor="middle" fill="#6B6B6B" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11px" font-weight="400" font-style="normal">2024</text><text x="660" y="655" text-anchor="middle" fill="#6B6B6B" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10px" font-weight="700" font-style="normal">Explicit Disagreement</text><text x="48" y="721" text-anchor="start" fill="#6B6B6B" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10px" font-weight="400" font-style="italic">Source: reviewed official DSA statements and Democratic Party platforms; quotations shortened only by line wrapping.</text></svg>
