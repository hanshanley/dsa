[project]
name = "dsa-analysis"
version = "0.1.0"
description = "Source-first analysis of DSA positions and Democratic primary contrasts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2025",
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.14,<2",
    "sentence-transformers>=3.0,<4",
    "torch>=2.4,<3",
    "umap-learn>=0.5.7,<0.6",
]

[project.scripts]
dsa-analysis = "dsa_analysis.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
